name: Deploy

on:
  push:
    branches:
      - main # → production
      - staging # → staging
  workflow_dispatch:
    inputs:
      environment:
        description: 'Environment (staging|production)'
        required: true
        default: 'staging'

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ${{ github.repository_owner }}/turizm-pazaryeri

jobs:
  # ===========================================================================
  # STAGING DEPLOY (main branch → staging)
  # ===========================================================================
  deploy-staging:
    name: Deploy to Staging
    if: github.ref == 'refs/heads/staging' || (github.event_name == 'workflow_dispatch' && github.event.inputs.environment == 'staging')
    runs-on: ubuntu-latest
    environment:
      name: staging
      url: https://staging.turizmpazaryeri.com
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Build shared
        run: |
          npm install --legacy-peer-deps
          npm run build:shared

      - name: Login to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & push API image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./apps/api/Dockerfile
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}-api:staging
            ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}-api:sha-${{ github.sha }}

      - name: Build & push Web image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./apps/web/Dockerfile
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}-web:staging
            ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}-web:sha-${{ github.sha }}

      - name: Deploy to staging server
        run: |
          echo "🚀 Deploying to staging.turizmpazaryeri.com"
          echo "  API image: ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}-api:staging"
          echo "  Web image: ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}-web:staging"
          # SSH ile staging sunucusuna bağlan, docker-compose pull + up
          # ssh staging@server "cd /opt/turizm-pazaryeri && docker-compose -f docker-compose.staging.yml pull && docker-compose -f docker-compose.staging.yml up -d"
          echo "  ⚠️ SSH deploy adımı secrets ile yapılandırılmalı (SSH_PRIVATE_KEY)"

      - name: Run Prisma migrations on staging DB
        run: |
          cd apps/api && npx prisma migrate deploy
        env:
          DATABASE_URL: ${{ secrets.STAGING_DATABASE_URL }}

      - name: Notify Slack
        if: always()
        uses: 8398a7/action-slack@v3
        with:
          status: ${{ job.status }}
          channel: '#deploys'
          fields: repo,message,commit,author
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK }}

  # ===========================================================================
  # PRODUCTION DEPLOY (manual approval after staging)
  # ===========================================================================
  deploy-production:
    name: Deploy to Production (Manual Approval)
    if: github.ref == 'refs/heads/main' || (github.event_name == 'workflow_dispatch' && github.event.inputs.environment == 'production')
    needs: deploy-staging
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://turizmpazaryeri.com
    steps:
      - uses: actions/checkout@v4

      - name: Login to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Tag staging images as production
        run: |
          docker pull ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}-api:staging
          docker tag ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}-api:staging ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}-api:production
          docker push ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}-api:production

          docker pull ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}-web:staging
          docker tag ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}-web:staging ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}-web:production
          docker push ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}-web:production

      - name: Database backup before deploy
        run: |
          echo "💾 Backing up production DB..."
          # pg_dump $PROD_DATABASE_URL > backup-$(date +%Y%m%d-%H%M%S).sql
          # Upload to S3: aws s3 cp backup-*.sql s3://backups/turizm-pazaryeri/db/

      - name: Run Prisma migrations on production DB
        run: |
          cd apps/api && npx prisma migrate deploy
        env:
          DATABASE_URL: ${{ secrets.PRODUCTION_DATABASE_URL }}

      - name: Deploy to production server
        run: |
          echo "🚀 Deploying to turizmpazaryeri.com"
          # ssh production@server "cd /opt/turizm-pazaryeri && docker-compose -f docker-compose.production.yml pull && docker-compose -f docker-compose.production.yml up -d"

      - name: Smoke test
        run: |
          sleep 30
          curl -f https://turizmpazaryeri.com/api/cities || exit 1
          curl -f https://turizmpazaryeri.com/ || exit 1

      - name: Notify Slack (production)
        if: always()
        uses: 8398a7/action-slack@v3
        with:
          status: ${{ job.status }}
          channel: '#deploys'
          fields: repo,message,commit,author
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK }}
